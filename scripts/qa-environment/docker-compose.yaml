# QA stack started by start.sh: a Cozy Stack serving the build of build.sh as the assistant app,
# with CouchDB, Mailpit catching the emails it sends, and a fake openRAG answering the chat.
services:
  couchdb:
    image: couchdb:3
    # Every Cozy instance opens tens of databases (shards and indexes): with the
    # default soft limit of 1024 open files, CouchDB fails (emfile, then
    # no_couch on every request) past a few dozen instances
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5984/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${QA_MAIL_PORT:?}:8025"

  openrag:
    image: node:24-alpine
    command: ["node", "/fake-openrag/server.mjs"]
    environment:
      PORT: "8000"
      FAKE_RAG_DELAY_MS: "${QA_FAKE_RAG_DELAY_MS:-40}"
    volumes:
      - ./fake-openrag:/fake-openrag:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health_check || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

  cozystack:
    image: ${QA_STACK_IMAGE:-cozy/cozy-stack:latest}
    pull_policy: always
    depends_on:
      couchdb:
        condition: service_healthy
      openrag:
        condition: service_healthy
    environment:
      COZY_ADMIN_PASSPHRASE: cozy
      # The instances are <uid>.cozy.localhost:<port>: the stack listens on the published port so
      # that the URLs it builds work from the host and from the network alike
      COZY_PORT: "${QA_STACK_PORT:?}"
    # The assistant and the scribe host are served from their directories (--appdir), not installed:
    # an app installed from file:// is reinstalled (copied and brotli-compressed, under a lock per
    # instance and app) on every request of its index page, which the load tests then measure
    # instead of the opening of the app.
    command: ["cozy-stack", "serve", "--dev", "--appdir", "assistant:/app/assistant,scribe-host:/app/scribe-host"]
    volumes:
      - ../../build:/app/assistant:ro
      - ./scribe-host:/app/scribe-host:ro
      - ./seed:/app/seed:ro
      - ./cozy.yml:/etc/cozy/cozy.yml:ro
    ports:
      - "127.0.0.1:${QA_STACK_PORT:?}:${QA_STACK_PORT:?}"
